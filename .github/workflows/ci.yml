name: بناء واختبار ونشر
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # بصمة الإصدار = آخر commit غيّر المصدر، وتحتاج التاريخ كاملاً
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: فحص الصياغة
        run: for f in src/*.js; do node --check "$f"; done
      - name: البناء
        run: python3 build.py && test -s dist/index.html && grep -q 'const BUILD = ' dist/index.html
      - name: تثبيت Playwright
        run: pip install playwright && python3 -m playwright install --with-deps chromium
      - name: سياسات الخادم على PostgreSQL حقيقي (قبول/رفض + قراءة)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
        run: bash tests/sql_policy_test.sh
      - name: تطابق الصلاحيات بين البرنامج والخادم (كل الأنواع × الأدوار + التراجعات)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: python3 tests/parity_test.py
      - name: الاستعادة والخادم من طرف إلى طرف (أجهزة حقيقية + PostgreSQL بسياساته)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: python3 tests/restore_e2e.py
      - name: الاختبارات (السيناريو الكامل + التأكيدات)
        run: python3 test_smoke.py
      - name: اختبارات الفشل (IndexedDB حقيقي، حقن أعطال التخزين والشبكة)
        run: python3 tests/audit_failures.py
      - name: انحدار المراجعة المستقلة 0.12.1 (R2-01..R2-14)
        run: python3 tests/audit_r2.py
      - name: "انحدار المراجعة المستقلة 0.13.1 (R3 — التعارضات حفظاً وحسماً وحذفاً، وترقية القاعدة)"
        run: python3 tests/audit_r3.py
      - name: "انحدار المراجعة المستقلة 0.13.2 (R4 — حسم لم يثبت، التخزين البديل، التعارضات في النسخة، الحسم بعد الحذف)"
        run: python3 tests/audit_r4.py
      - name: "انحدار المراجعة المستقلة 0.13.3 (R5 — تاريخ التعارضات في النسخة، الإلغاء بعد الحذف، تعارضان على سجل)"
        run: python3 tests/audit_r5.py
      - name: "التراجع عن سجل بعينه وجسر تطبيق أندرويد (0.14)"
        run: python3 tests/audit_app.py
      - name: مسح كل الأزرار في كل الشاشات والأدوار
        run: python3 tests/crawl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dist-and-shots, path: "dist/index.html\nshots/" }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
