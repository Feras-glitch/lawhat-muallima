<html lang="ar" dir="rtl">

<title>لوحة المعلمة · برنامج القرآن</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a24;--muted:#6b7570;--line:#e3e0d6;--brand:#1f6f5f;--brand2:#2f8f7a;--soft:#e8f2ee;--green:#2e9e5b;--yellow:#e0a800;--red:#d14b3f;--blue:#2f6fb0;--grey:#c9c6bc;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;font-size:17px;line-height:1.6}
body{direction:rtl;min-height:100vh;padding-bottom:84px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--soft);color:var(--brand)}
button.primary{background:var(--brand);color:#fff}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
button.ghost.on{background:var(--brand);color:#fff;border-color:var(--brand)}
button.danger{background:#fbe9e7;color:var(--red)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.9em;color:var(--muted);margin:8px 0 4px}
header.top{position:sticky;top:0;z-index:5;background:rgba(246,244,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top .title{font-weight:700;color:var(--brand)}
header.top .sub{font-size:.85em;color:var(--muted)}
.status{font-size:.8em;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grey);display:inline-block}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.off{background:var(--yellow)}
main{padding:14px 14px 20px;max-width:980px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.15em;color:var(--brand)}
.card h3{margin:12px 0 6px;font-size:1em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85em;background:var(--soft);color:var(--brand)}
.pill.g{background:#e3f4e8;color:var(--green)}.pill.y{background:#fbf3d6;color:#8a6a00}.pill.r{background:#fbe9e7;color:var(--red)}.pill.n{background:#eee;color:#666}
.muted{color:var(--muted)}
.small{font-size:.86em}
.big{font-size:1.3em;font-weight:700}
nav.bottom{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.bottom button{background:transparent;color:var(--muted);padding:6px 8px;border-radius:10px;font-size:.85em;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
nav.bottom button.active{color:var(--brand);background:var(--soft)}
nav.bottom .ico{font-size:1.25em}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps .chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.steps li.done .chk{background:var(--green);border-color:var(--green)}
.steps .body{flex:1}
.steps .min{color:var(--muted);font-size:.85em}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-g{background:#e3f4e8;color:var(--green)}.btn-y{background:#fbf3d6;color:#8a6a00}.btn-r{background:#fbe9e7;color:var(--red)}
.btn-g.on{background:var(--green);color:#fff}.btn-y.on{background:var(--yellow);color:#fff}.btn-r.on{background:var(--red);color:#fff}
.pagechip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:#f1efe8;margin:3px}
.map{display:block}
.map .c{aspect-ratio:1;border-radius:3px;background:#ececec;font-size:.5em;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
.map .c.far{background:#cfe9d7}.map .c.near{background:#cfe0f5}.map .c.new{background:#f3e3b8}
.map .c.green{background:var(--green)}.map .c.yellow{background:var(--yellow)}.map .c.red{background:var(--red)}
.map .c.stale{outline:2px solid var(--red)}
.map .c.today{outline:2px solid var(--blue)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-inline-end:12px;font-size:.85em}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.light{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle}
.light.green{background:var(--green)}.light.yellow{background:var(--yellow)}.light.red{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:.9em;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.9em}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand)}
.login{max-width:420px;margin:60px auto;padding:0 16px}
.login .roles{display:grid;gap:10px;margin:16px 0}
.login .roles button{padding:16px;font-size:1.05em;background:#fff;border:1px solid var(--line);color:var(--ink);text-align:right}
.login .roles button.sel{border-color:var(--brand);background:var(--soft)}
.alert{background:#fff8e6;border:1px solid #f1dc9a;border-radius:10px;padding:10px 12px;margin:8px 0}
.alert.red{background:#fbe9e7;border-color:#f3b9b2}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi .v{font-size:1.4em;font-weight:700;color:var(--brand)}
.kpi .k{font-size:.8em;color:var(--muted)}

details summary{cursor:pointer;color:var(--brand)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

pre{white-space:pre-wrap;background:#f1efe8;padding:10px;border-radius:10px;font-size:.8em;direction:ltr;text-align:left}
.present{position:fixed;inset:0;background:#fffdf7;z-index:40;display:flex;flex-direction:column;padding:16px}

.phuge{font-size:clamp(3em,12vw,8em);font-weight:700;color:var(--brand);line-height:1.1}
.pbig{font-size:clamp(1.4em,4vw,2.4em);font-weight:600}
.pchips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}

  let last = 114;
  if (p < 604) { const [s1, a1] = pageFirst(p + 1); last = a1 === 1 ? s1 - 1 : s1; }
  const list = []; for (let s = s0; s <= last; s++) list.push(s); return list;
}

function ayahRangeOnPage(p, s) {
  if (!surahsOfPage(p).includes(s)) return null;
  const [s0, a0] = pageFirst(p);
  const from = s === s0 ? a0 : 1;
  let to = SURAH_AYAT[s - 1];
  if (p < 604) { const [s1, a1] = pageFirst(p + 1); if (s1 === s) to = a1 - 1; }
  return [from, to];
}
/* صفحة آية معينة (بحث ثنائي) */
function pageOfAyah(s, a) {
  let lo = 1, hi = 604;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; const [ms, ma] = pageFirst(mid); if (ms < s || (ms === s && ma <= a)) lo = mid; else hi = mid - 1; }
  return lo;
}
function pageLabel(p) {
  const ss = surahsOfPage(p);

}

const LS_EVENTS = 'lm_events_v1';

const Store = {
  events: [],
  settings: {},
  /* ===== التخزين: IndexedDB (سعة كبيرة، كتابة سجل واحد لا الكل) مع ترحيل تلقائي من localStorage وبديل عند تعذّر IDB ===== */
  db: null, idbOk: false, pending: new Map(), flushTimer: null,
  async openDb() {
    if (!window.indexedDB) return null;
    return new Promise((res) => {
      let req; try { req = indexedDB.open('lawhat_muallima', 1); } catch (e) { res(null); return; }
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains('events')) db.createObjectStore('events', { keyPath: 'id' }); };
      req.onsuccess = () => res(req.result); req.onerror = () => res(null); req.onblocked = () => res(null);
    });
  },
  async load() {
    try { this.settings = JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}'); } catch (e) { this.settings = {}; }
    if (!this.settings.pins) this.settings.pins = { aya: '1111', asst: '2222', parent: '3333' };
    if (!this.settings.deviceId) this.settings.deviceId = 'd' + Math.random().toString(36).slice(2, 10);

    let lsRaw = []; try { lsRaw = JSON.parse(localStorage.getItem(LS_EVENTS) || '[]'); } catch (e) { lsRaw = []; }
    this.db = await this.openDb();
    if (this.db) {
      const fromDb = await new Promise((res) => { try { const tx = this.db.transaction('events', 'readonly'); const r = tx.objectStore('events').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res(null); } catch (e) { res(null); } });
      if (fromDb) {
        this.idbOk = true;
        const have = new Set(fromDb.map(e => e.id));
        const migrate = lsRaw.filter(e => e && e.id && !have.has(e.id));
        this.raw = fromDb.concat(migrate).sort((a, b) => a.ts - b.ts);
        if (migrate.length) { const ok = await this.putMany(migrate); if (ok) { try { localStorage.removeItem(LS_EVENTS); } catch (e) {} } }
        else if (lsRaw.length && !migrate.length) { try { localStorage.removeItem(LS_EVENTS); } catch (e) {} }
      } else { this.raw = lsRaw; }
    } else { this.raw = lsRaw; }
    this.migrateV2();
    this.refresh();
  },
  /* ترحيل 0.11 ← 0.12: حالة المزامنة لكل خادم. «مرفوع» القديم يصير «على الخادم الحالي»، والمؤشر والمرفوضات تنتقل إلى حالة ذلك الخادم،
     وتُطلب مطابقة كاملة عند أول تزامن لتصحيح أي علامة قديمة غير دقيقة */
  migrateV2() {
    const s = this.settings; if (s.schema >= 2) return;
    const id = s.sbUrl ? serverId(s.sbUrl) : null;
    s.servers = s.servers || {};
    if (id) {
      const cur = typeof s.sbCursor === 'string' ? { t: s.sbCursor, id: '' } : (s.sbCursor || null);
      s.servers[id] = Object.assign({ cursor: cur, rejected: s.syncRejected || [], since: Date.now() }, s.servers[id] || {}, { accepted: true, needReconcile: true });
      if (s.sbSession) s.sbSession.sid = id;
    }
    delete s.sbCursor; delete s.syncRejected;
    const changed = [];
    for (const e of this.raw) {
      if (!('synced' in e) && !('pushRejected' in e)) continue;
      if (id && e.synced === true) { if (e.pushRejected) e.rj = [id]; else e.sv = [id]; }
      delete e.synced; delete e.pushRejected; changed.push(e);
    }
    s.schema = 2;
    if (changed.length) this.saveEvents(changed);
    this.saveSettings();
  },
  /* حقول محلية لا تخرج من الجهاز (لا إلى الخادم ولا إلى ملف) */
  LOCAL_FIELDS: ['sv', 'rj', 'synced', 'pushRejected'],

  /* كتابة سجلات بعينها إلى IDB */
  putMany(list) {
    if (!this.idbOk || !this.db) return Promise.resolve(false);
    return new Promise((res) => { try { const tx = this.db.transaction('events', 'readwrite'); const st = tx.objectStore('events'); for (const e of list) st.put(e); tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); } catch (e) { res(false); } });
  },
  clearDb() { if (!this.idbOk || !this.db) return Promise.resolve(false); return new Promise((res) => { try { const tx = this.db.transaction('events', 'readwrite'); tx.objectStore('events').clear(); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } }); },
  /* الحفظ: مع IDB تُكتب السجلات المتغيرة فقط؛ بدونه يُكتب الكل في localStorage (متزامن).
     مع IDB: add يعيد فوراً والسجل «جارٍ حفظه» (dirty) حتى تكتمل المعاملة؛ نقاط الالتزام (إنهاء جلسة، سحب) تنتظر durable(). */
  dirty: new Set(), flushing: null, retryTimer: null,
  saveEvents(changed) {
    if (this.idbOk) {
      for (const e of (changed || this.raw)) this.dirty.add(e.id);
      clearTimeout(this.flushTimer); this.flushTimer = setTimeout(() => this.flush(), 20);
      try { UI.renderStatus(); } catch (x) {}
      return true;
    }
    try { localStorage.setItem(LS_EVENTS, JSON.stringify(this.raw)); this.storageError = null; return true; } catch (e) { this.storageError = 'تعذّر الحفظ: امتلأت ذاكرة الجهاز. صدّري البيانات وأبلغي ولي الأمر.'; return false; } },
  /* هل كل ما في الذاكرة محفوظ دائماً الآن؟ */
  saved() { return this.idbOk ? this.dirty.size === 0 && !this.storageError : !this.storageError; },
  /* ينتظر اكتمال الكتابة الدائمة لكل ما سُجّل حتى الآن */
  async durable() { if (!this.idbOk) return !this.storageError; clearTimeout(this.flushTimer); await this.flush(); return this.saved(); },
  gen: 0,
  /* كتابة دفعة واحدة من المعلّق؛ عند الفشل يبقى معلّقاً (إلا إن مُسح السجل أثناءها) */
  async flushOnce() {
    const gen = this.gen;
    const ids = this.dirty; this.dirty = new Set();
    const list = this.raw.filter(e => ids.has(e.id));
    const ok = await this.putMany(list);
    if (!ok) {
      if (gen === this.gen) {
        for (const id of ids) this.dirty.add(id);
        /* طوارئ: نسخة كاملة في localStorage إن اتسعت؛ تُدمج عند الفتح التالي وتُمحى فور نجاح الحفظ */
        let lsOk = false; try { localStorage.setItem(LS_EVENTS, JSON.stringify(this.raw)); lsOk = true; } catch (e) {}
        this.storageError = lsOk ? 'تعذّر الحفظ في قاعدة الجهاز (حُفظت نسخة احتياطية مؤقتة)؛ صدّري البيانات' : 'تعذّر الحفظ في قاعدة الجهاز وامتلأت الذاكرة؛ صدّري البيانات فوراً ولا تغلقي الصفحة';
        try { UI.toast(this.storageError); } catch (x) {}
        clearTimeout(this.retryTimer); this.retryTimer = setTimeout(() => this.flush(), 5000);
      }
    } else if (!this.dirty.size && gen === this.gen) {
      this.storageError = null; /* كل شيء ثابت في IDB الآن */
      /* كل السجلات في IDB الآن: نسخة الطوارئ لم تعد لازمة، ومحوها يمنع إحياء ما حُذف لاحقاً */
      try { localStorage.removeItem(LS_EVENTS); } catch (e) {}
    }
    try { UI.renderStatus(); } catch (x) {}
    return ok;

  /* يكتب كل المعلّق ويعيد true فقط إن ثبت كله؛ المستدعون المتزامنون ينتظرون الدفعة الجارية ولا يعودون قبلها */
  async flush() {
    for (;;) {
      if (this.flushing) { const ok = await this.flushing; if (!ok) return false; continue; }

  roleAllows(by, ev) {

      const k = `${e.surah}:${e.ayah}`;
      if (!items[k]) items[k] = { key: k, surah: e.surah, ayah: e.ayah, page: e.page, first: e.day, last: e.day, count: 0, types: {}, passes: [], target: null };
      const it = items[k]; it.count++; it.last = e.day; it.types[e.etype] = (it.types[e.etype] || 0) + 1;
      if (e.etype === 'jump' && e.target) it.target = e.target;
    }
    if (e.type === 'yellow_pass' && items[`${e.surah}:${e.ayah}`]) {
      const it = items[`${e.surah}:${e.ayah}`];
      if (!it.passes.includes(e.day) && e.day > it.last) it.passes.push(e.day);
    }
    if (e.type === 'error' && e.surah && e.ayah) { items[`${e.surah}:${e.ayah}`].passes = items[`${e.surah}:${e.ayah}`].passes.filter(d => d > e.day); }
  }
  const all = Object.values(items);
  return { active: all.filter(i => i.passes.length < 3), cleared: all.filter(i => i.passes.length >= 3) };
}

function mutashabihat(childId, sinceDay) {
  return Store.events.filter(e => e.child === childId && e.type === 'error' && e.etype === 'jump' && (!sinceDay || e.day >= sinceDay));
}

/* بطاقات */
function cardsFor(childId) {

  return map;

/* أسبوع العمل الحالي: من السبت */
function weekStartKey(d) { const x = new Date(d); const diff = (x.getDay() + 1) % 7; x.setDate(x.getDate() - diff); return dayKey(x); }

/* النتيجة النافذة: آخر حدث لكل (طفل، صفحة، خطوة، يوم) — إعادة النقر تصحيح لا تكرار */
function effectiveOutcomes(filter) {
  const map = new Map();
  for (const e of Store.events) if (e.type === 'outcome' && (!filter || filter(e))) map.set(`${e.child}|${e.page}|${e.step}|${e.day}|${segKey(e.lines)}|${e.parent ? 'p' : ''}`, e);
  return [...map.values()].sort((a, b) => a.ts - b.ts);
}

function segKey(lines) { return lines ? `${lines[0]}-${lines[1]}` : ''; }
function sameSeg(a, b) { return segKey(a) === segKey(b); }
/* مؤشرات الصحة لطفل */
function healthOf(childId) {
  const st = deriveChild(childId);
  const ws = weekStartKey(App.now());
  const gates = effectiveOutcomes(e => e.child === childId && e.day >= ws && e.step === 'gate' && !e.parent);
  const gateFails = gates.filter(e => e.result !== 'clean' && e.result !== 'partial').length;
  const exams = effectiveOutcomes(e => e.child === childId && e.step === 'exam' && !e.parent);
  let examGreen = null, examN = 0, examClean = 0, examDay = null;
  if (exams.length) { examDay = exams[exams.length - 1].day; const last = exams.filter(e => e.day === examDay && e.result !== 'partial'); examN = last.length; examClean = last.filter(e => e.result === 'clean').length; examGreen = examN ? Math.round(100 * examClean / examN) : null; }
  const evaluated = gates.length > 0 || exams.length > 0;
  let light = evaluated ? 'green' : 'grey';
  if (gateFails >= 2 || (st.far.length && st.maxGap > 12) || (examGreen != null && examGreen < 70)) light = 'red';
  else if (gateFails === 1 || (st.far.length && st.maxGap > 10) || (examGreen != null && examGreen < 85)) light = 'yellow';
  return { st, gateFails, gateN: gates.length, examGreen, examN, examClean, examDay, maxGap: st.maxGap, light, evaluated };
}

/* الجلسة الحالية والقادمة حسب الساعة */
function sessionsFor(role, date) {
  const d = date.getDay();
  return PLAN.filter(s => s.day === d && (!role || role === 'parent' || s.teacher === role)).sort((a, b) => a.start.localeCompare(b.start));
}
function toMin(s) { const [h, m] = s.split(':').map(Number); return h * 60 + m; }
function currentSession(role, date) {
  const list = sessionsFor(role, date); const nowM = date.getHours() * 60 + date.getMinutes();
  let current = null, next = null;
  for (const s of list) {
    if (toMin(s.start) <= nowM && nowM < toMin(s.end)) current = s;
    else if (toMin(s.start) > nowM && !next) next = s;
  }
  return { list, current, next };
}
function sessionKey(s, dayK) { return `${dayK}|${s.start}|${s.kind}|${s.child}`; }
function sessionDone(s, dayK) { return !!sessionStatus(s, dayK); }
/* آخر سجل إنهاء للجلسة (أو null) */
/* حالة الجلسة: آخر إنهاء أو إلغاء، مع كشف التعارض (تسجيل من معلمتين بمعرّفين، أو إلغاء ثم إنهاء متأخر) */
function sessionStatus(s, dayK) {
  const k = sessionKey(s, dayK);
  const ks = Store.ofKey(k);
  const dones = ks.filter(e => e.type === 'session_done');
  const cancels = ks.filter(e => e.type === 'session_cancel');
  if (!dones.length && !cancels.length) return null;
  const last = [...dones, ...cancels].sort((a, b) => a.ts - b.ts).pop();
  const sids = new Set(dones.map(e => e.sid)); const bys = new Set(dones.map(e => e.proxyFor ? e.by : e.by));
  const conflicts = [];
  if (sids.size > 1) conflicts.push(`سُجّلت ${sids.size} مرات بمعرّفين مختلفين (${[...bys].map(b => ROLES[b] ? ROLES[b].name : b).join('، ')})`);
  if (cancels.length && dones.length) conflicts.push('أُلغيت ووصل لها إنهاء أيضاً');
  const st = last.type === 'session_cancel' ? 'cancelled' : (last.status || 'complete');
  return Object.assign({}, last, { status: st, conflicts, dones, cancels });
}
function statusName(st) { return { complete: 'اكتملت', partial: 'بقي جزء', stopped: 'توقفت', cancelled: 'أُلغيت' }[st] || 'اكتملت'; }
/* جلسات اليوم المسجلة بلا تكرار (بالمفتاح لا بعدد السجلات) */
function doneKeys(filter) { return new Set(Store.events.filter(e => e.type === 'session_done' && (!filter || filter(e))).map(e => e.key)); }
/* صفحة الطلاقة الحالية لكريم: آخر حدث في السجل، لا إعداد الجهاز */
function fluencyPage(c) { const l = Store.events.filter(e => e.type === 'fluency_page' && e.child === c); return l.length ? l[l.length - 1].page : (Store.settings['fluency_' + c] || 582); }

/* ===== بطاقات التسليم ===== */
function handoffs(filter) {
  const st = {};
  const upd = {};
  for (const e of Store.events) {
    if (e.type === 'handoff_status') st[e.handoff] = { status: e.status, day: e.day, by: e.by, ts: e.ts };
    if (e.type === 'handoff_update') { (upd[e.handoff] = upd[e.handoff] || []).push(e); if (st[e.handoff] && st[e.handoff].status === 'handled' && st[e.handoff].ts < e.ts) st[e.handoff] = { status: 'reopened', day: e.day, by: e.by, ts: e.ts }; }
  }
  return Store.events.filter(e => e.type === 'handoff').map(h => { const us = upd[h.id] || []; const items = h.items.concat(...us.map(u => u.items.map(i => Object.assign({}, i, { addedDay: u.day })))); return Object.assign({}, h, { items, updates: us.length, state: st[h.id] ? st[h.id].status : 'new', stateDay: st[h.id] ? st[h.id].day : null }); }).filter(h => !filter || filter(h));
}
function handoffFor(key, child) { return Store.events.filter(e => e.type === 'handoff' && e.key === key && e.child === child).pop() || null; }
/* تكرار موضع انتقال معيّن (سورة/آية) وآخر ظهوره */
function jumpStats(child, surah, ayah) {
  const l = Store.events.filter(e => e.type === 'error' && e.child === child && e.etype === 'jump' && e.surah === surah && e.ayah === ayah);
  return { n: l.length, last: l.length ? l[l.length - 1].day : null };
}

/* ===== اللون المقترح من المعايير الكاملة (الوثيقة: أخضر = بلا تلقين، زلة واحدة مصحَّحة ذاتياً، تجويد سليم، إجابة المعنى) ===== */
function suggestColor(child, page, day, lines) {
  const outs = effectiveOutcomes(e => e.child === child && e.day === day && e.page === page && !e.parent && (lines ? sameSeg(e.lines, lines) : true));
  const allErrs = Store.events.filter(e => e.child === child && e.day === day && e.type === 'error' && e.page === page);
  /* مع مقطع محدد: تُحسب أخطاء المقطع نفسه فقط؛ الأخطاء بلا مقطع تُعرض للمراجعة ولا تُنسب لكل المقاطع */
  const errs = lines ? allErrs.filter(e => e.lines && sameSeg(e.lines, lines)) : allErrs;
  const unassigned = lines ? allErrs.filter(e => !e.lines) : [];
  const full = outs.filter(o => o.result !== 'partial');
  const incomplete = outs.length > 0 && full.length === 0;
  const prompts = Math.max(full.reduce((m, o) => Math.max(m, o.prompts != null ? o.prompts : (o.result === 'yellow' ? 1 : o.result === 'red' ? 3 : 0)), 0), errs.filter(e => e.etype === 'prompt').length);
  const hesit = errs.filter(e => e.etype === 'hesitate').length + full.reduce((a, o) => a + (o.selfCorrect || 0), 0);
  const tajweedIssue = full.some(o => o.tajweed === 'issue') || errs.some(e => e.etype === 'tajweed');
  /* شرط المعنى يخص الصفحة الجديدة (البوابة والتسميعات الثلاثة)؛ البعيد والفحص أسئلتهما من البطاقات في خطوة مستقلة */
  const NEW_STEPS = ['gate', 'first', 'second', 'third'];
  const needsMeaning = full.some(o => NEW_STEPS.includes(o.step));
  const meaning = full.some(o => o.meaning === 'support') ? 'support' : full.some(o => o.meaning === 'ok') ? 'ok' : (needsMeaning ? 'untested' : 'n/a');
  const stop = full.some(o => o.result === 'red');
  const reasons = [];
  let color, pending = false;
  if (!outs.length) color = 'none';
  else if (incomplete) { color = 'none'; reasons.push('لم يُسمَّع كاملاً'); }
  else if (stop || prompts >= 3) { color = 'red'; reasons.push(stop ? 'توقف تام أو حكم أحمر' : `${prompts} تلقينات`); }
  else if (prompts >= 1 || hesit > 1 || tajweedIssue || meaning === 'support' || errs.some(e => ['swap', 'jump', 'skip'].includes(e.etype))) {
    color = 'yellow';
    if (prompts) reasons.push(`تلقين ${prompts}`); if (hesit > 1) reasons.push(`${hesit} زلات`); if (tajweedIssue) reasons.push('تجويد'); if (meaning === 'support') reasons.push('المعنى يحتاج دعماً');
    for (const t of ['swap', 'jump', 'skip']) { const n = errs.filter(e => e.etype === t).length; if (n) reasons.push(`${ERROR_TYPES.find(x => x.id === t).short || t} ${n}`); }
  } else if (meaning === 'untested') { color = 'none'; pending = true; reasons.push('الحفظ مستقل — المعنى لم يُختبر — بانتظار الاعتماد'); }
  else color = 'green';
  if (unassigned.length) reasons.push(`${unassigned.length} خطأ بلا مقطع — للمراجعة`);
  return { color, pending, reasons, prompts, hesit, tajweedIssue, meaning, incomplete, n: outs.length, lines: lines || null, unassigned: unassigned.length };
}

/* آخر ورد نظر للطفل (لا يمس طبقات الحفظ ولا تواريخ المراجعة) */
function lastTilawa(c, kind) { const l = Store.events.filter(e => e.type === 'tilawa' && e.child === c && (!kind || e.kind === kind)); return l.length ? l[l.length - 1] : null; }
function juzExams(c, juz) { return Store.events.filter(e => e.type === 'juz_exam' && e.child === c && e.juz === juz); }

/* ===== التزامن الاختياري مع خادم Supabase ===== */
/* هوية الخادم = رابط المشروع مطبَّعاً. لكل خادم حالته المستقلة في settings.servers:
   قبول صريح (accepted)، مؤشر السحب، المرفوضات، وتقرير آخر مطابقة.
   وفي كل سجل: e.sv = الخوادم التي ثبت وجوده عليها، e.rj = الخوادم التي رفضته رفضاً دائماً.
   الجلسة مربوطة بالخادم الذي أصدرها (sbSession.sid) فلا تنتقل إلى غيره. */
function serverId(url) { return String(url || '').trim().replace(/\/+$/, '').toLowerCase(); }
const hasIn = (arr, v) => Array.isArray(arr) && arr.includes(v);
const PUSH_CHUNK = 500;
const PAGE = 1000;

const Sync = {
  timer: null, busy: false, lastError: null, lastOk: null, incomplete: false, lastIds: null, RECHECK_MS: 60000,
  cfg() {
    const s = Store.settings;
    if (!s.sbUrl || !s.sbKey || s.localMode) return null;
    const id = serverId(s.sbUrl);
    if (!(s.servers && s.servers[id] && s.servers[id].accepted)) return null;
    return { url: s.sbUrl.trim().replace(/\/+$/, ''), key: s.sbKey.trim(), id };
  },
  sid() { const c = this.cfg(); return c ? c.id : null; },
  st(id) { id = id || this.sid(); if (!id) return null; return (Store.settings.servers || {})[id] || null; },
  session() { const s = Store.settings.sbSession; return s && s.sid && s.sid === this.sid() ? s : null; },
  role() { return this.session() && ROLES[Store.settings.sbRole] ? Store.settings.sbRole : null; },
  token() { const s = this.session(); return s && s.access_token; },
  headers(json) {
    const c = this.cfg(); const h = { apikey: c.key, Authorization: 'Bearer ' + (this.token() || c.key) };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  },
  async login(email, password) {
    const c = this.cfg(); if (!c) throw new Error('لم يُضبط الخادم');
    const r = await fetch(`${c.url}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || 'فشل الدخول');
    Store.settings.sbSession = { sid: c.id, access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: j.user && j.user.email };
    let role = null;
    try {
      const pr = await fetch(`${c.url}/rest/v1/profiles?select=role&user_id=eq.${j.user.id}`, { headers: { apikey: c.key, Authorization: 'Bearer ' + j.access_token } });
      const rows = await pr.json(); role = rows && rows[0] && rows[0].role;
    } catch (e) {}
    Store.settings.sbRole = ROLES[role] ? role : null;
    Store.saveSettings();
    return Store.settings.sbRole;
  },
  async refresh() {
    const c = this.cfg(); const s = this.session(); if (!c || !s || !s.refresh_token) return false;
    if (Date.now() < s.expires_at - 60000) return true;
    const r = await fetch(`${c.url}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r.ok) { Store.settings.sbSession = null; Store.saveSettings(); return false; }
    const j = await r.json();
    Store.settings.sbSession = { sid: c.id, access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: s.email };
    Store.saveSettings(); return true;
  },
  logout() { Store.settings.sbSession = null; Store.settings.sbRole = null; Store.saveSettings(); },

  /* ===== تغيير الخادم ===== */
  isKnown(url) { const all = Store.settings.servers || {}; const x = all[serverId(url)]; return !!(x && x.accepted); },
  /* الانتقال إلى خادم مقبول (أو قبوله الآن بعد اختيار صريح): لا تنتقل الجلسة ولا المؤشر، وتُجرى مطابقة كاملة عند أول تزامن */
  switchTo(url, key) {
    const s = Store.settings; const id = serverId(url);
    s.servers = s.servers || {};
    if (!s.servers[id]) s.servers[id] = { cursor: null, rejected: [], since: Date.now() };
    Object.assign(s.servers[id], { accepted: true, needReconcile: true });
    s.sbUrl = url.trim(); s.sbKey = key.trim(); s.localMode = false;
    s.sbSession = null; s.sbRole = null;
    this.lastError = null; this.lastOk = null; this.incomplete = false; this.lastIds = null;
    Store.saveSettings();
  },
  /* عدد سجلات هذا الجهاز بحسب حالتها على خادم: سجلات الدور الحالي المنتظرة، وسجلات أدوار أخرى ليست عليه */
  counts(id) {
    id = id || this.sid(); const me = this.role(); const r = { ownPending: 0, waitingTarget: 0, others: {}, othersTotal: 0, rejected: 0 };
    if (!id) return r;
    let byId = null;
    for (const e of Store.raw) {
      if (hasIn(e.sv, id)) continue;
      if (hasIn(e.rj, id)) { r.rejected++; continue; }
      if (me && e.by === me) {
        r.ownPending++;
        if (e.type === 'undo') { byId = byId || new Map(Store.raw.map(x => [x.id, x])); const t = byId.get(e.target); if (!t || !hasIn(t.sv, id)) r.waitingTarget++; }
      } else { const k = e.by || '?'; r.others[k] = (r.others[k] || 0) + 1; r.othersTotal++; }
    }
    return r;
  },

  /* ===== تصنيف الأخطاء ===== */
  /* ترتيب المؤشرات: الوقت ثم المعرّف (نصوص الخادم بصيغة واحدة فتُقارن نصاً عند تساوي الميلي ثانية) */
  cmpCursor(a, b) { if (a.t === b.t) return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; const d = Date.parse(a.t) - Date.parse(b.t); return d || (a.t < b.t ? -1 : 1); },
  isPermanent(status) { return [400, 403, 409, 422].includes(status); },
  transientMsg(status) { return status === 401 ? 'انتهت الجلسة، أعيدي الدخول' : status === 429 ? 'الخادم مشغول (حدّ الطلبات)؛ سيُعاد الرفع تلقائياً' : status >= 500 ? `عطل مؤقت في الخادم (${status})؛ سيُعاد الرفع تلقائياً` : `تعذّر الرفع مؤقتاً (${status})؛ سيُعاد تلقائياً`; },
  schedule() { if (!this.cfg()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 1500); },
  /* أي تغيير للخادم أثناء الجولة يوقفها: لا يُكتب مؤشر أو علامة لخادم على خادم آخر */
  guard(c) { if (this.sid() !== c.id) throw new Error('تغيّر الخادم أثناء المزامنة؛ أُوقفت الجولة'); },

  async run() {
    const c = this.cfg();
    if (!c || this.busy || !navigator.onLine) return;
    this.busy = true;
    try {
      if (!(await this.refresh())) { this.lastError = 'انتهت الجلسة، أعيدي الدخول'; return; }
      const st = this.st(c.id);
      const full = !!st.needReconcile;
      if (full) await this.reconcile(c);
      await this.push(c);
      let n = await this.pull(c);
      /* ما سُحب (أو عُلّم «على الخادم») قد يكون هدفاً لتراجع منتظر: يُرفع في الجولة نفسها. بلا منتظر = لا طلب */
      await this.push(c);
      /* فحص رخيص كل جولة: خادم يحمل أقل مما ثبت رفعه إليه = استُعيد من نسخة أقدم أو فُقد منه شيء */
      if (!full && !this.incomplete && await this.countMismatch(c)) { await this.reconcile(c); await this.push(c); n += await this.pull(c); }
      /* تقرير «لم تكتمل» يُعاد فحصه تلقائياً متى خلا الجهاز مما ينتظر، فيتحول إلى «اكتملت» دون تدخل */
      if (!this.incomplete && st.report && !st.report.complete && Date.now() - (st.reconciledAt || 0) > this.RECHECK_MS) {
        const k = this.counts(c.id);
        if (!k.ownPending && !k.othersTotal && !st.rejected.length) { await this.reconcile(c); n += await this.pull(c); }
      }
      if (this.lastIds && this.lastIds.sid === c.id) this.writeReport(c);
      this.guard(c);
      const rejN = st.rejected.length;
      this.lastOk = Date.now();
      this.lastError = this.incomplete ? 'المزامنة لم تكتمل بعد (دفعة كبيرة)؛ تُستكمل تلقائياً' : rejN ? `${rejN} سجل مرفوض بانتظار المعالجة (الإعدادات ← المرفوضات)` : null;
      Store.saveSettings();
      if (n) UI.rerender();
    } catch (err) { this.lastError = err.message; }
    finally { this.busy = false; UI.renderStatus(); }
  },

  /* ===== الرفع: سجلات الدور الحالي التي ليست على هذا الخادم؛ العادية أولاً ثم التراجعات، بدفعات ===== */
  toRow(e) { return { id: e.id, ts: e.ts, day: e.day, by: e.by, child: e.child || null, type: e.type, dev: e.dev || null, payload: Store.clean(e) }; },
  async push(c) {
    const me = this.role(); if (!me) return;
    const post = rows => fetch(`${c.url}/rest/v1/events?on_conflict=id`, { method: 'POST', headers: Object.assign(this.headers(true), { Prefer: 'resolution=ignore-duplicates,return=minimal' }), body: JSON.stringify(rows) });
    const all = Store.raw.filter(e => e.by === me && !hasIn(e.sv, c.id) && !hasIn(e.rj, c.id));
    const byId = new Map(Store.raw.map(e => [e.id, e]));
    /* التراجع يُرفع بعد أن يثبت هدفه على هذا الخادم (سياسة الخادم تشترطه)؛ هدف لم يصل بعد (سجل دور آخر لم يرفعه صاحبه) = ينتظر ولا يُعدّ مرفوضاً */
    const undoReady = () => all.filter(e => e.type === 'undo' && !hasIn(e.sv, c.id) && (t => t && hasIn(t.sv, c.id))(byId.get(e.target)));
    for (const getPhase of [() => all.filter(e => e.type !== 'undo'), undoReady]) {
      const phase = getPhase();
      for (let i = 0; i < phase.length; i += PUSH_CHUNK) {
        const chunk = phase.slice(i, i + PUSH_CHUNK);
        const r = await post(chunk.map(e => this.toRow(e)));
        this.guard(c);
        if (r.ok) { for (const e of chunk) Store.markOn(e, c.id); Store.saveEvents(chunk); continue; }
        if (!this.isPermanent(r.status)) throw new Error(this.transientMsg(r.status));
        /* رفض دائم: يُعزل السجل المرفوض وحده مع سببه ولا تتوقف البقية.
           خطأ مؤقت أثناء الفحص الفردي يُبقي السجل منتظراً ويوقف الجولة. */
        for (const e of chunk) {
          const r1 = await post([this.toRow(e)]);
          this.guard(c);
          if (r1.ok) { Store.markOn(e, c.id); Store.saveEvents([e]); continue; }
          if (!this.isPermanent(r1.status)) throw new Error(this.transientMsg(r1.status));
          let why = 'رفض الخادم (' + r1.status + ')'; try { const j = await r1.json(); if (j && j.message) why += ': ' + j.message; } catch (x) {}
          e.rj = (e.rj || []).filter(x => x !== c.id).concat(c.id);
          const st = this.st(c.id);
          if (!st.rejected.some(x => x.id === e.id)) st.rejected.push({ id: e.id, type: e.type, by: e.by, child: e.child || null, day: e.day, reason: 'لم يقبل الخادم الرفع — ' + why, at: Date.now(), payload: Store.clean(e), direction: 'push' });
          Store.saveEvents([e]); Store.saveSettings();
        }
      }
    }
  },

  /* ===== السحب بمؤشر (inserted_at, id) خاص بهذا الخادم ===== */
  async pull(c) {
    const st = this.st(c.id);
    let n = 0;
    const EPOCH = '1970-01-01T00:00:00Z';
    let cur = st.cursor;
    if (!cur || typeof cur.t !== 'string') cur = { t: EPOCH, id: '' };
    /* نافذة تداخل 5 ثوانٍ مرة واحدة في بداية الجولة (صف التُزم متأخراً لا يضيع؛ المكرر يُزال بالمعرّف)، ثم مؤشر متقدم حصراً */
    let q = cur.t === EPOCH ? { t: cur.t, id: cur.id } : { t: new Date(Math.max(0, Date.parse(cur.t) - 5000)).toISOString(), id: '' };
    let best = cur, complete = false;
    for (let round = 0; round < 50; round++) {
      const t = encodeURIComponent(q.t), id = encodeURIComponent(q.id);
      const r2 = await fetch(`${c.url}/rest/v1/events?select=id,by,type,child,payload,inserted_at&or=(inserted_at.gt.${t},and(inserted_at.eq.${t},id.gt.${id}))&order=inserted_at.asc,id.asc&limit=${PAGE}`, { headers: this.headers() });
      this.guard(c);
      if (!r2.ok) throw new Error((this.isPermanent(r2.status) ? 'رفض الخادم السحب: ' + r2.status : this.transientMsg(r2.status)));
      const rows = await r2.json();
      if (!rows.length) { complete = true; break; }
      /* أعمدة الخادم (المحمية بالسياسات) تغلب ما في payload؛ والحقول المحلية في payload قديم تُهمل */
      const incoming = rows.map(r => Object.assign(Store.clean(r.payload || {}), { id: r.id, by: r.by, type: r.type, child: r.child || undefined }));
      const bad = incoming.filter(e => !Store.validEvent(e, incoming) || !Store.roleAllows(e.by, e));
      if (bad.length) { /* كل المرفوضات تُحفظ مع سببها بلا حد؛ القائمة السابقة تُستعاد عند فشل الحفظ */
        const prev = st.rejected; const next = prev.slice();
        for (const e of bad) if (!next.some(x => x.id === e.id)) next.push({ id: e.id, type: e.type, by: e.by, child: e.child || null, day: e.day, reason: Store.rejectReason(e, incoming), at: Date.now(), payload: e });
        st.rejected = next;
        try { Store.saveSettings(); } catch (err) { st.rejected = prev; this.lastError = 'تعذّر حفظ السجلات المرفوضة (امتلأت الذاكرة)؛ لن يتقدم المؤشر'; UI.renderStatus(); throw new Error(this.lastError); }
      }
      n += Store.importEvents(incoming.filter(e => !bad.includes(e)), { server: c.id });
      /* المؤشر لا يتقدم إلا بعد ثبوت السجلات على القرص */
      if (!(await Store.durable())) throw new Error('تعذّر حفظ السجلات المسحوبة على الجهاز؛ لن يتقدم المؤشر وستُعاد المحاولة');
      this.guard(c);
      const last = rows[rows.length - 1]; q = { t: last.inserted_at, id: last.id };
      if (this.cmpCursor(q, best) > 0) { best = q; st.cursor = best; Store.saveSettings(); }
      if (rows.length < PAGE) { complete = true; break; }
    }
    this.incomplete = !complete;
    if (!complete) setTimeout(() => this.run(), 2000);
    return n;
  },

  /* ===== المطابقة الكاملة: كل معرّفات الخادم مقابل سجلات الجهاز ===== */
  async fetchIds(c) {
    const ids = new Set(); let after = null;
    for (let i = 0; i < 2000; i++) {
      const r = await fetch(`${c.url}/rest/v1/events?select=id&order=id.asc&limit=${PAGE}${after !== null ? '&id=gt.' + encodeURIComponent(after) : ''}`, { headers: this.headers() });
      this.guard(c);
      if (!r.ok) throw new Error(this.isPermanent(r.status) ? 'رفض الخادم المطابقة: ' + r.status : this.transientMsg(r.status));
      const rows = await r.json();
      for (const x of rows) ids.add(x.id);
      if (rows.length < PAGE) return ids;
      after = rows[rows.length - 1].id;
    }
    throw new Error('تعذّرت المطابقة: الخادم أكبر من المتوقع');
  },
  async reconcile(c) {
    const ids = await this.fetchIds(c);
    const st = this.st(c.id); const changed = [];
    for (const e of Store.raw) {
      const on = ids.has(e.id), had = hasIn(e.sv, c.id);
      if (on && !had) { Store.markOn(e, c.id); changed.push(e); }
      else if (!on && had) { e.sv = e.sv.filter(x => x !== c.id); changed.push(e); }
    }
    /* ما على الخادم وليس هنا يُسحب من البداية (المكرر يُزال بالمعرّف) */
    const local = new Set(Store.raw.map(e => e.id)); const rej = new Set(st.rejected.map(x => x.id));
    for (const id of ids) if (!local.has(id) && !rej.has(id)) { st.cursor = null; break; }
    if (changed.length) Store.saveEvents(changed);
    st.needReconcile = false; st.reconciledAt = Date.now();
    this.lastIds = { sid: c.id, ids };
    Store.saveSettings();
  },
  async countMismatch(c) {
    try {
      const r = await fetch(`${c.url}/rest/v1/events?select=id&limit=1`, { headers: Object.assign(this.headers(), { Prefer: 'count=exact' }) });
      if (!r.ok) return false;
      const m = /\/(\d+)\s*$/.exec(r.headers.get('content-range') || ''); if (!m) return false;
      const server = Number(m[1]);
      const known = Store.raw.reduce((k, e) => k + (hasIn(e.sv, c.id) ? 1 : 0), 0);
      const st = this.st(c.id); st.serverCount = server;
      /* أقل مما ثبت رفعه = فُقد شيء من الخادم. (الزيادة طبيعية: أجهزة أخرى ترفع، والسحب يأتي بها) */
      return server < known;
    } catch (e) { return false; }
  },
  /* تقرير بعد مطابقة كاملة: لا يُعلن الاكتمال إلا إن لم يبقَ شيء، وإلا يُذكر ما بقي وسببه */
  writeReport(c) {
    const st = this.st(c.id); const k = this.counts(c.id);
    const local = new Set(Store.raw.map(e => e.id)); const rej = new Set(st.rejected.map(x => x.id));
    let serverOnly = 0; for (const id of this.lastIds.ids) if (!local.has(id) && !rej.has(id)) serverOnly++;
    const rep = { at: Date.now(), ownPending: k.ownPending, waitingTarget: k.waitingTarget, others: k.others, othersTotal: k.othersTotal, rejected: st.rejected.length, serverOnly, incomplete: this.incomplete };
    rep.complete = !rep.ownPending && !rep.othersTotal && !rep.rejected && !rep.serverOnly && !rep.incomplete;
    st.report = rep; this.lastIds = null;
  },
  started: false,
  start() { if (this.cfg() && !this.started) { this.started = true; this.run(); setInterval(() => this.run(), 30000); window.addEventListener('online', () => this.run()); } },
};

/* ثلاث حالات مختلفة الإجراء: «لم يُقيَّم بعد» = لا بوابة ولا فحص؛ «لم يُقيَّم كاملاً» = تسميع ناقص لصفحة؛ «بانتظار اعتماد آية» = لون مقترح لم يُعتمد */
function lightText(h) { return h.light === 'grey' ? 'لم يُقيَّم بعد: لا بوابة ولا فحص خميس' : h.light === 'green' ? 'سليم' : h.light === 'yellow' ? 'يحتاج انتباهاً' : 'يحتاج قراراً'; }

/* ===== النسخ الاحتياطي، استعادة الجهاز، استعادة الخادم، وبطاقة الخادم ===== */
/* ثلاثة إجراءات منفصلة:
   1. تبادل ملف / دمج: كل السجلات بالتراجعات ومعرّفاتها وأصحابها؛ يُضاف الجديد ولا يُكرَّر.
   2. استعادة جهاز فارغ: السجلات + إعدادات الخادم (بلا رموز الدخول ولا جلسات ولا مؤشرات)، ثم دخول جديد ومطابقة كاملة.
   3. استعادة خادم: ملفات SQL تُشغَّل في SQL Editor؛ كل سجل يُدرج باسم دوره فتنطبق عليه سياسات الخادم نفسها. */
const BACKUP_FORMAT = 'lawhat-muallima-backup';
const DAY_MS = 86400000;

const Backup = {
  /* ما يلزم لإعادة الجهاز فقط */
  SETTINGS_KEYS: ['sbUrl', 'sbKey', 'sounds', 'endAlarm'],
  build() {
    const events = Store.raw.map(e => Store.clean(e));
    const settings = {};
    for (const k of this.SETTINGS_KEYS) if (Store.settings[k] != null && Store.settings[k] !== '') settings[k] = Store.settings[k];
    return {
      format: BACKUP_FORMAT, formatVersion: 2, app: { version: BUILD.version, commit: BUILD.commit },
      exported: new Date().toISOString(), device: Store.settings.deviceId, role: App.role ? App.role.id : null,
      counts: { all: events.length, live: Store.events.length, undo: events.filter(e => e.type === 'undo').length },
      settings, events,
    };
  },
  download() {
    const b = this.build();
    const blob = new Blob([JSON.stringify(b)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `lawhat-backup-${todayKey()}-${b.role || 'x'}.json` });
    document.body.append(a); a.click(); a.remove();
    Store.settings.lastBackup = { at: Date.now(), count: b.counts.all };
    Store.saveSettings();
    return b;
  },
  /* النسخة الكاملة (0.12+) أو ملف قديم (سجلات حيّة فقط بلا تراجعات) */
  parse(text) {
    const j = JSON.parse(text);
    if (j && j.format === BACKUP_FORMAT) {
      if (!Array.isArray(j.events)) throw new Error('ملف النسخة بلا سجلات');
      return { full: true, meta: j, events: j.events, settings: j.settings || {} };
    }
    const list = Array.isArray(j) ? j : j && j.events;
    if (!Array.isArray(list)) throw new Error('ليس ملف سجلات من لوحة المعلمة');
    return { full: false, meta: Array.isArray(j) ? {} : j, events: list, settings: {} };
  },
  /* دمج بلا علامة «على الخادم»؛ مع خادم متصل تُطلب مطابقة كاملة تصحّح العلامات وتُظهر ما بقي */
  merge(parsed) {
    const n = Store.importEvents(parsed.events);
    const st = Sync.st();
    if (st) { st.needReconcile = true; Store.saveSettings(); Sync.schedule(); }
    return n;
  },
  restoreDevice(parsed) {
    const n = this.merge(parsed);
    const s = parsed.settings || {};
    if (s.sounds != null) Store.settings.sounds = s.sounds;
    if (s.endAlarm != null) Store.settings.endAlarm = s.endAlarm;
    if (s.sbUrl && s.sbKey) Sync.switchTo(s.sbUrl, s.sbKey); else Store.saveSettings();
    return n;
  },
  /* أيام منذ آخر نسخة إن تجاوزت 7 وفي الجهاز سجلات أحدث منها؛ وإلا null */
  overdue() {
    if (!Store.raw.length) return null;
    const lb = Store.settings.lastBackup;
    if (!lb) return Infinity;
    const days = Math.floor((Date.now() - lb.at) / DAY_MS);
    if (days < 7) return null;
    return Store.raw.some(e => (e.ts || 0) > lb.at) ? days : null;
  },
};

/* ===== التخزين الدائم: يُطلب مرة بعد الدخول، ونتيجته معروضة. قد يُرفض، ولا يغني عن النسخ ===== */
const Persist = {
  state: 'unknown',
  async check() {
    if (!(navigator.storage && navigator.storage.persisted)) return (this.state = 'unsupported');
    try { this.state = (await navigator.storage.persisted()) ? 'granted' : 'denied'; } catch (e) { this.state = 'unsupported'; }
    return this.state;
  },
  async request() {
    if (!(navigator.storage && navigator.storage.persist)) return (this.state = 'unsupported');
    try { this.state = (await navigator.storage.persist()) ? 'granted' : 'denied'; } catch (e) { this.state = 'denied'; }
    Store.settings.persistAsked = Date.now(); Store.saveSettings();
    return this.state;
  },
  async auto() { if ((await this.check()) === 'denied' && !Store.settings.persistAsked) await this.request(); },
  standalone() { return !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone); },
  text() {
    const inst = this.standalone() ? 'البرنامج مثبّت على الشاشة الرئيسية' : 'البرنامج مفتوح في المتصفح (على iPhone ثبّتيه على الشاشة الرئيسية)';
    const st = { granted: 'التخزين الدائم ممنوح', denied: 'التخزين الدائم غير ممنوح — المتصفح قد يمحو البيانات عند ضيق المساحة', unsupported: 'التخزين الدائم غير مدعوم في هذا المتصفح', unknown: 'التخزين الدائم: لم يُفحص' }[this.state];
    return `${st} · ${inst}`;
  },
};

/* ===== استعادة الخادم: SQL يُشغَّل في SQL Editor ===== */
const ServerRestore = {
  PART: 2000,
  /* العادية أولاً ثم التراجعات (هدف التراجع يجب أن يسبقه على الخادم) */
  parts() {
    const evs = Store.raw.map(e => Store.clean(e));
    const byTs = (a, b) => a.ts - b.ts;
    const ordered = evs.filter(e => e.type !== 'undo').sort(byTs).concat(evs.filter(e => e.type === 'undo').sort(byTs));
    const out = [];
    for (let i = 0; i < ordered.length; i += this.PART) out.push(ordered.slice(i, i + this.PART));
    return out;
  },
  sql(chunk, k, total) {
    const json = JSON.stringify(chunk);
    let tag = 'lm_json'; while (json.includes('$' + tag + '$')) tag += '_x';
    return `-- لوحة المعلمة · استعادة الخادم · الجزء ${k} من ${total} · ${chunk.length} سجل
-- الإصدار ${BUILD.version} (${BUILD.commit}) · أُعدّ ${new Date().toISOString()} من الجهاز ${Store.settings.deviceId}
-- يُشغَّل في SQL Editor لمشروع Supabase بعد إعداد الجداول وإنشاء المستخدمين الثلاثة وأدوارهم في profiles.
-- كل سجل يُدرج باسم دوره (set role authenticated) فتنطبق عليه سياسات الخادم نفسها؛ الموجود يُتجاهل؛ المرفوض يُذكر بسببه.
-- آمن للتكرار. شغّلي الأجزاء بالترتيب (التراجعات في الأجزاء الأخيرة).
create temp table if not exists lm_restore_log (part int, id text, by text, type text, status text, reason text);
delete from lm_restore_log where part = ${k};
do $lm_do$
declare
  js jsonb := $${tag}$${json}$${tag}$::jsonb;
  x jsonb; uid text; n int;
begin
  for x in select value from jsonb_array_elements(js) loop
    select p.user_id::text into uid from public.profiles p where p.role = x->>'by' order by p.user_id limit 1;
    if uid is null then
      insert into lm_restore_log values (${k}, x->>'id', x->>'by', x->>'type', 'rejected', 'لا يوجد في profiles مستخدم بدور ' || coalesce(x->>'by', '؟'));
      continue;
    end if;
    begin
      perform set_config('request.jwt.claim.sub', uid, true);
      perform set_config('request.jwt.claims', json_build_object('sub', uid, 'role', 'authenticated')::text, true);
      perform set_config('role', 'authenticated', true);
      insert into public.events (id, ts, day, by, child, type, dev, payload)
        values (x->>'id', (x->>'ts')::bigint, x->>'day', x->>'by', x->>'child', x->>'type', x->>'dev', x)
        on conflict (id) do nothing;
      get diagnostics n = row_count;
      perform set_config('role', 'none', true);
      insert into lm_restore_log values (${k}, x->>'id', x->>'by', x->>'type', case when n = 1 then 'inserted' else 'exists' end, null);
    exception when others then
      perform set_config('role', 'none', true);
      insert into lm_restore_log values (${k}, x->>'id', x->>'by', x->>'type', 'rejected', sqlerrm);
    end;
  end loop;
end $lm_do$;
select status as "الحالة", count(*) as "العدد",
  string_agg(id || ' — ' || coalesce(reason, ''), E'\\n') filter (where status = 'rejected') as "المرفوض وسببه"
from lm_restore_log where part = ${k} group by status order by status;
`;
  },
  download(text, k, total) {
    const blob = new Blob([text], { type: 'application/sql' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `lawhat-restore-${todayKey()}-${k}-of-${total}.sql` });
    document.body.append(a); a.click(); a.remove();
  },
};

/* ===== الواجهات ===== */
function roleName(r) { return ROLES[r] ? ROLES[r].name : (r || 'غير معروف'); }

function BackupReminder() {
  const d = Backup.overdue(); if (d == null) return null;
  return el('div', { class: 'alert' }, d === Infinity ? 'لم تُصدَّر نسخة احتياطية من هذا الجهاز بعد. ' : `آخر نسخة احتياطية من هذا الجهاز قبل ${d} يوماً. `,
    el('button', { class: 'ghost small', onclick: () => { Backup.download(); UI.toast('صُدّرت النسخة'); UI.rerender(); } }, 'تصدير نسخة كاملة الآن'));
}

function BackupCard() {
  const lb = Store.settings.lastBackup;
  const fileIn = el('input', { type: 'file', accept: '.json,application/json' });
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; if (!f) return;
    let p; try { p = Backup.parse(await f.text()); } catch (e) { UI.modal('لم يُقرأ الملف', el('p', null, e.message)); return; } finally { fileIn.value = ''; }
    ImportDialog(p);
  });
  const persistLine = el('p', { class: 'small muted' }, Persist.text());
  Persist.check().then(() => { persistLine.textContent = Persist.text(); });
  return el('div', { class: 'card' }, el('h2', null, 'النسخ الاحتياطي وتبادل الملفات'),
    el('p', { class: 'small muted' }, 'النسخة الكاملة تحمل كل السجلات بالتراجعات ومعرّفاتها وأصحابها، وإعدادات الخادم بلا كلمات سر ولا جلسات ولا رموز دخول. الاستيراد يدمج ولا يكرر.'),
    el('p', { class: 'small' }, lb ? `آخر نسخة من هذا الجهاز: ${fmtDay(dayKey(new Date(lb.at)))} ${hhmm(new Date(lb.at))} (${lb.count} سجل)` : 'لم تُصدَّر نسخة من هذا الجهاز بعد'),
    persistLine,
    el('div', { class: 'btns' },
      el('button', { class: 'primary', onclick: () => { Backup.download(); UI.toast('صُدّرت النسخة'); UI.rerender(); } }, `تصدير نسخة كاملة (${Store.raw.length} سجل)`),
      Persist.state !== 'granted' ? el('button', { class: 'ghost', onclick: async () => { await Persist.request(); UI.toast(Persist.text()); UI.rerender(); } }, 'طلب التخزين الدائم') : null),
    label('استيراد ملف (دمج، أو استعادة جهاز فارغ)'), fileIn);
}

function ImportDialog(p) {
  const have = new Set(Store.raw.map(e => e.id));
  const evs = p.events.filter(e => e && typeof e === 'object');
  const undo = evs.filter(e => e.type === 'undo').length;
  const fresh = evs.filter(e => !have.has(e.id)).length;
  const m = p.meta || {};
  const body = el('div', null,
    el('p', null, p.full ? `نسخة من الإصدار ${m.app ? m.app.version : '؟'} (${m.app ? m.app.commit : '؟'})، صُدّرت ${m.exported ? m.exported.slice(0, 16).replace('T', ' ') : '؟'} من دور ${roleName(m.role)}.` : 'ملف بصيغة قديمة (قبل 0.12).'),
    el('p', null, `${evs.length} سجلاً (${undo} تراجعاً)، منها ${fresh} ليست على هذا الجهاز.`),
    p.full ? null : el('div', { class: 'alert' }, 'هذا الملف يحمل السجلات الحيّة فقط بلا تراجعات: ما تراجعتِ عنه في الجهاز المصدِّر لا يصل تراجعه إلى هنا.'),
    p.full && p.settings.sbUrl ? el('p', { class: 'small muted' }, `وفيه إعدادات الخادم: ${p.settings.sbUrl}`) : null);
  const canRestore = p.full && Store.raw.length === 0 && p.settings.sbUrl && p.settings.sbKey;
  let bg;
  const merge = () => { bg.remove(); try { const n = Backup.merge(p); UI.savedToast(`أُضيف ${n} سجلاً وحُفظ`); UI.rerender(); } catch (e) { UI.modal('لم يُستورد الملف', el('p', null, e.message)); } };
  const restore = () => {
    bg.remove();
    try { const n = Backup.restoreDevice(p); App.logout(); UI.savedToast(`استُعيد ${n} سجلاً؛ ادخلي بحسابك على الخادم لتكتمل المطابقة`); }
    catch (e) { UI.modal('لم تُستعد النسخة', el('p', null, e.message)); }
  };
  bg = UI.modal('استيراد ملف', body, [
    canRestore ? el('button', { class: 'primary', onclick: restore }, 'استعادة الجهاز (السجلات + الخادم)') : null,
    el('button', { class: canRestore ? 'ghost' : 'primary', onclick: merge }, 'دمج السجلات فقط'),
    el('button', { class: 'ghost', onclick: () => bg.remove() }, 'إلغاء')]);
  if (canRestore) body.append(el('p', { class: 'small' }, 'استعادة الجهاز: تُضاف السجلات ويتصل الجهاز بالخادم المحفوظ في النسخة. بعد الدخول تُرفع سجلات دورك التي ليست عليه، ويظهر تقرير بما بقي.'));
}

      el('li', null, 'شغّلي ملفات الاستعادة بالترتيب، وراجعي نتيجة كل جزء (المرفوض وسببه).'),

function syncReportView(st) {
  const r = st && st.report; if (!r) return null;
  const when = `${fmtDay(dayKey(new Date(r.at)))} ${hhmm(new Date(r.at))}`;
  if (r.complete) return el('div', { class: 'alert', style: 'background:#e8f5e9;border-color:#a5d6a7' }, `✓ اكتملت المطابقة (${when}): كل سجلات هذا الجهاز على الخادم، وكل ما على الخادم على هذا الجهاز.`);
  const items = [];
  const wt = r.waitingTarget || 0;
  if (r.ownPending - wt > 0) items.push(`${r.ownPending - wt} من سجلات دورك لم تُرفع بعد — تُرفع في الجولة التالية`);
  if (wt) items.push(`${wt} من تراجعاتك بانتظار وصول السجل الأصلي إلى الخادم — يرفعه جهاز صاحبه، ثم يُرفع التراجع تلقائياً`);
  for (const [by, n] of Object.entries(r.others || {})) items.push(`${n} من سجلات ${roleName(by)} ليست على الخادم — يرفعها جهاز ${roleName(by)} عند دخوله، أو «استعادة الخادم» من جهاز ولي الأمر`);
  if (r.rejected) items.push(`${r.rejected} سجلاً رفضها الخادم أو رفضها الجهاز — انظري المرفوضات`);
  if (r.serverOnly) items.push(`${r.serverOnly} سجلاً على الخادم لم تصل هذا الجهاز بعد — تُسحب في الجولة التالية`);
  if (r.incomplete) items.push('السحب لم يكتمل (دفعة كبيرة) — يُستكمل تلقائياً');
  return el('div', { class: 'alert' }, el('div', null, el('b', null, `المطابقة لم تكتمل (${when}):`)), el('ul', { class: 'small', style: 'margin:4px 0' }, items.map(t => el('li', null, t))));
}

function ServerCard() {
  const s = Store.settings; const c = Sync.cfg();
  const url = el('input', { value: s.sbUrl || '', placeholder: 'https://xxxx.supabase.co', dir: 'ltr' });
  const key = el('input', { value: s.sbKey || '', placeholder: 'anon public key', dir: 'ltr' });
  const save = () => {
    const u = url.value.trim(), k = key.value.trim();
    if (!u && !k) {
      UI.confirm('فصل هذا الجهاز عن الخادم؟ تبقى السجلات على الجهاز.', () => { s.sbUrl = ''; s.sbKey = ''; s.sbSession = null; s.sbRole = null; Store.saveSettings(); App.logout(); });
      return;
    }
    if (!/^https?:\/\/\S+$/.test(u) || !k) { UI.toast('أدخلي رابط المشروع والمفتاح العام'); return; }
    if (s.sbUrl && serverId(u) === serverId(s.sbUrl) && Sync.isKnown(u)) { s.sbKey = k; Store.saveSettings(); UI.toast('حُفظ'); UI.rerender(); return; }
    ServerSwitchDialog(u, k);
  };
  const card = el('div', { class: 'card' }, el('h2', null, 'الخادم (الحسابات الثلاثة عبر الإنترنت)'),
    el('p', { class: 'small muted' }, 'اختياري. بدونه يعمل البرنامج محلياً مع تبادل بالملفات. مع الخادم تتزامن الأجهزة وتعمل بلا إنترنت ثم ترفع. تغيير الرابط لا ينقل الدخول ولا موضع المزامنة، ولا يرفع شيئاً إلى خادم جديد قبل اختيار صريح.'),
    label('رابط المشروع'), url, label('المفتاح العام'), key,
    s.localMode && s.sbUrl ? el('div', { class: 'alert' }, 'الوضع المحلي مفعّل والمزامنة متوقفة. ', el('button', { class: 'ghost small', onclick: () => { s.localMode = false; Store.saveSettings(); App.logout(); } }, 'العودة للاتصال بالخادم')) : null,
    el('div', { class: 'btns' }, el('button', { class: 'primary', onclick: save }, 'حفظ'),
      el('button', { class: 'ghost', onclick: () => UI.modal('إعداد الخادم', el('div', null, el('p', { class: 'small' }, 'أنشئ مشروعاً في supabase.com، ثم نفّذ هذا في SQL Editor، ثم أنشئ المستخدمين الثلاثة وضع لكل منهم الدور في جدول profiles.'), el('pre', null, SETUP_SQL))) }, 'تعليمات الإعداد')));
  if (c) {
    const k = Sync.counts(); const st = Sync.st();
    const others = Object.entries(k.others).map(([by, n]) => `${roleName(by)} ${n}`).join('، ');
    card.append(el('p', { class: 'small muted' }, Sync.lastOk ? `آخر تزامن ${hhmm(new Date(Sync.lastOk))}` : 'لم يتزامن بعد في هذه الجلسة', Sync.lastError ? ` · ${Sync.lastError}` : ''),
      el('p', { class: 'small' }, Sync.role() ? `سجلات دورك بانتظار الرفع: ${k.ownPending}` : 'لم يُدخل إلى هذا الخادم بعد', k.othersTotal ? ` · سجلات أدوار أخرى ليست على الخادم: ${others}` : ''),
      syncReportView(st) || el('p', { class: 'small muted' }, st.needReconcile ? 'مطابقة كاملة مطلوبة: تُجرى عند التزامن التالي.' : 'لم تُجرَ مطابقة كاملة مع هذا الخادم بعد.'),
      el('div', { class: 'btns' },
        el('button', { class: 'ghost small', onclick: async () => { await Sync.run(); UI.rerender(); } }, 'تزامن الآن'),
        el('button', { class: 'ghost small', onclick: async () => { st.needReconcile = true; Store.saveSettings(); UI.toast('تجري المطابقة…'); await Sync.run(); UI.rerender(); } }, 'مطابقة كاملة')));
  }
  return card;
}

/* اختيار صريح عند خادم لم يتصل به الجهاز من قبل: لا رفع تلقائياً لبيانات الأطفال لمجرد تغيير الرابط */
function ServerSwitchDialog(u, k) {
  if (Sync.isKnown(u)) {
    UI.confirm(`الانتقال إلى ${u}؟ اتصل به هذا الجهاز من قبل: تُستأنف مزامنته من موضعها، وتجري مطابقة كاملة، ويلزم الدخول إليه من جديد.`, () => { Sync.switchTo(u, k); App.logout(); });
    return;
  }
  if (!Store.raw.length) { Sync.switchTo(u, k); App.logout(); UI.toast('اتصل الجهاز بالخادم؛ ادخلي بحسابك'); return; }
  const byRole = {}; for (const e of Store.raw) byRole[e.by || '?'] = (byRole[e.by || '?'] || 0) + 1;
  const dist = Object.entries(byRole).map(([r, n]) => `${roleName(r)} ${n}`).join('، ');
  let bg;
  const family = () => UI.confirm('تأكيد: هذا خادم العائلة. بعد الدخول يُسحب ما فيه إلى هذا الجهاز، وتُرفع إليه سجلات دورك التي ليست عليه.', () => { bg.remove(); Sync.switchTo(u, k); App.logout(); UI.toast('ادخلي بحسابك على الخادم الجديد'); });
  const separate = () => {
    bg.remove();
    let b2;
    const exp = el('button', { onclick: () => { Backup.download(); wipe.disabled = false; UI.toast('صُدّرت النسخة'); } }, 'تصدير نسخة كاملة أولاً');
    const wipe = el('button', { class: 'danger', disabled: true, onclick: () => UI.confirm(`حذف ${Store.raw.length} سجلاً من هذا الجهاز ثم الاتصال بالخادم الجديد؟ لا يمس أي خادم.`, async () => {
      b2.remove(); const ok = await Store.reset(); Store.settings.active = null; Store.saveSettings();
      if (!ok) { UI.toast('تعذّر الحذف الكامل؛ لم يتصل الجهاز'); return; }
      Sync.switchTo(u, k); App.logout(); UI.toast('الجهاز نظيف ومتصل بالخادم الجديد؛ ادخلي بحسابك');
    }) }, 'حذف سجلات الجهاز ثم الاتصال');
    b2 = UI.modal('خادم منفصل', el('div', null,
      el('p', null, 'هذا الجهاز يحمل سجلات العائلة، فلا يتصل بخادم منفصل وهي عليه (كانت ستُخلط بسجلاته).'),
      el('p', { class: 'small' }, 'للتجربة: استعملي متصفحاً آخر أو جهازاً آخر. أو ابدئي هذا الجهاز نظيفاً: صدّري نسخة كاملة ثم احذفي سجلاته.')),
      [exp, wipe, el('button', { class: 'ghost', onclick: () => b2.remove() }, 'إلغاء')]);
  };
  bg = UI.modal('خادم جديد لهذا الجهاز', el('div', null,
    el('p', null, `${u} لم يتصل به هذا الجهاز من قبل. على الجهاز ${Store.raw.length} سجلاً (${dist}).`),
    el('p', null, el('b', null, 'خادم العائلة (انتقال أو استعادة): '), 'يُسحب ما فيه، وتُرفع إليه سجلات دورك التي لا يملكها. سجلات الأدوار الأخرى يرفعها أصحابها أو «استعادة الخادم».'),
    el('p', null, el('b', null, 'خادم منفصل (تجربة أو غيره): '), 'لا يُرفع إليه شيء من سجلات هذا الجهاز.')),
    [el('button', { class: 'primary', onclick: family }, 'خادم العائلة'), el('button', { onclick: separate }, 'خادم منفصل'), el('button', { class: 'ghost', onclick: () => bg.remove() }, 'إلغاء')]);
}

function RejectedCard() {
  const st = Sync.st(); const sid = Sync.sid();
  const rej = st ? st.rejected : [];
  if (!rej.length) return null;

/* ===== تصدير التقويم ===== */
function downloadIcs(role) {
  const byday = { 6: 'SA', 0: 'SU', 1: 'MO', 2: 'TU', 3: 'WE', 4: 'TH' };
  const pad = n => String(n).padStart(2, '0');
  // أول حدوث: أقرب يوم مطابق من الأسبوع الحالي
  const base = App.now();
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//lawhat-muallima//AR', 'CALSCALE:GREGORIAN', 'BEGIN:VTIMEZONE', 'TZID:Asia/Shanghai', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0800', 'TZOFFSETTO:+0800', 'TZNAME:CST', 'END:STANDARD', 'END:VTIMEZONE'];
  const items = PLAN.filter(s => s.teacher === role).map(s => ({ day: s.day, start: s.start, end: s.end, title: `${childName(s.child)} · ${SESSION_KINDS[s.kind].name}` }));
  for (const d of WORKDAYS) items.push({ day: d, start: '11:40', end: '12:10', title: 'الاستراحة الرئيسية' });
  let i = 0;
  for (const it of items) {
    const first = new Date(base); first.setDate(first.getDate() + ((it.day - first.getDay() + 7) % 7));
    const ds = `${first.getFullYear()}${pad(first.getMonth() + 1)}${pad(first.getDate())}`;
    const t = hm => hm.replace(':', '') + '00';
    lines.push('BEGIN:VEVENT', `UID:lm-${role}-${i++}@lawhat`, `DTSTAMP:${ds}T000000Z`, `DTSTART;TZID=Asia/Shanghai:${ds}T${t(it.start)}`, `DTEND;TZID=Asia/Shanghai:${ds}T${t(it.end)}`, `RRULE:FREQ=WEEKLY;BYDAY=${byday[it.day]}`, `SUMMARY:${it.title}`, 'BEGIN:VALARM', 'TRIGGER:-PT5M', 'ACTION:DISPLAY', `DESCRIPTION:${it.title}`, 'END:VALARM', 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
  const a = el('a', { href: URL.createObjectURL(blob), download: `jadwal-${role}.ics` }); document.body.append(a); a.click(); a.remove();
}

/* ===== الموجز لولي الأمر: أُنجز / تحسّن / يحتاج متابعة / قرار الأسبوع ===== */
function briefFor(c) {
  const ws = weekStartKey(App.now()); const d = deriveChild(c);
  const wk = e => e.child === c && e.day >= ws;
  const newPages = [...new Set(Store.events.filter(e => e.type === 'new_page' && wk(e)).map(e => e.page))];
  const farHeard = [...new Set(effectiveOutcomes(e => wk(e) && e.step === 'far' && e.result !== 'partial').map(e => e.page))];
  const colors = Store.events.filter(e => e.type === 'color' && e.child === c);
  const prevColor = {}; const improved = [];
  for (const e of colors) { if (e.day >= ws && prevColor[e.page] && prevColor[e.page] !== 'green' && e.color === 'green') improved.push(e.page); prevColor[e.page] = e.color; }
  const redNow = d.far.concat(d.near).filter(p => d.pages[p].color === 'red');
  const openHand = handoffs(h => h.child === c && h.state !== 'handled');
  const jumps = openHand.flatMap(h => h.items.filter(i => i.k === 'jump'));
  const partials = Store.events.filter(e => e.type === 'session_done' && wk(e) && e.status && e.status !== 'complete');
  const dec = Store.events.filter(e => e.type === 'decision' && e.child === c).pop();
  return { newPages, farHeard, improved: [...new Set(improved)], redNow, openHand, jumps, partials, dec, d };
}
function BriefCard() {
  const card = el('div', { class: 'card' }, el('h2', null, 'الموجز الأسبوعي'), el('p', { class: 'muted small' }, 'ما أُنجز، ما تحسّن، ما يحتاج متابعة، وقرار الأسبوع. التفاصيل في صفحة كل طفل.'));
  for (const c of CHILD_ORDER) {
    const b = briefFor(c);
    card.append(el('div', { style: 'border-top:1px solid var(--line);padding:8px 0' },
      el('div', { class: 'row between' }, el('b', null, CHILDREN[c].name), el('button', { class: 'ghost small', onclick: () => { App.sub.child = c; App.sub.ctab = 'summary'; App.view = 'children'; UI.rerender(); } }, 'التفاصيل')),
      el('div', { class: 'small' }, el('b', null, 'أُنجز: '), `${b.newPages.length} ${c === 'karim' ? 'مقطع' : 'صفحة'} جديدة هذا الأسبوع${b.newPages.length ? ' (' + b.newPages.join('، ') + ')' : ''} · سُمّع من البعيد ${b.farHeard.length} صفحة`),
      el('div', { class: 'small' }, el('b', null, 'تحسّن: '), b.improved.length ? `صفحات صارت خضراء: ${b.improved.join('، ')}` : 'لا تغيّر في الألوان هذا الأسبوع'),
      el('div', { class: 'small' }, el('b', null, 'يحتاج متابعة: '), [b.redNow.length ? `${b.redNow.length} صفحة حمراء (${b.redNow.slice(0, 6).join('، ')}${b.redNow.length > 6 ? '…' : ''})` : null, b.jumps.length ? `${b.jumps.length} متشابه مفتوح` : null, b.openHand.length ? `${b.openHand.length} بطاقة تسليم لم تُعالَج` : null, b.partials.length ? `${b.partials.length} جلسة لم تكتمل` : null].filter(Boolean).join(' · ') || 'لا شيء معلّق'),
      el('div', { class: 'small' }, el('b', null, 'قرار الأسبوع: '), b.dec ? `${decisionName(b.dec.kind)} (${fmtDay(b.dec.day)})${b.dec.text ? ' — ' + b.dec.text : ''}` : 'لا قرار مسجل')));
  }
  return card;
}

/* ===== وضع العرض: شاشة نظيفة تُشارك مع الأطفال في برنامج الاجتماع ===== */
function openPresent(s) {
  const kids = childrenOf(s); let child = kids[0]; let mode = 'page';
  const bg = el('div', { class: 'present' });
  const render = () => {
    bg.innerHTML = '';
    const d = deriveChild(child); const cards = cardsFor(child);
    const page = contextPage(s, child);
    const top = el('div', { class: 'ptop' },
      el('div', { class: 'row' }, kids.length > 1 ? kids.map(k => el('button', { class: child === k ? 'primary' : 'ghost', onclick: () => { child = k; render(); } }, CHILDREN[k].name)) : el('span', { class: 'big' }, CHILDREN[child].name)),
      el('div', { class: 'row' }, [['page', 'الصفحة'], ['far', 'حصة البعيد'], ['card', 'البطاقة'], ['mut', 'المتشابهات'], ['yellow', 'الصفراء']].map(([m, n]) => el('button', { class: mode === m ? 'primary' : 'ghost', onclick: () => { mode = m; render(); } }, n)), el('button', { class: 'danger', onclick: () => bg.remove() }, '✕ إغلاق')));
    const body = el('div', { class: 'pbody' }); const add = (...x) => body.append(...x.flat().filter(v => v !== null && v !== false && v !== undefined));
    if (mode === 'page') add(el('div', { class: 'phuge' }, page ? `صفحة ${page}` : '—'), el('div', { class: 'pbig' }, page ? surahsOfPage(page).map(n => SURAH_NAMES[n - 1]).join(' · ') : ''), child === 'karim' && d.nextLines && page === d.nextNew ? el('div', { class: 'pbig' }, `الأسطر ${d.nextLines[0]}–${d.nextLines[1]}`) : null, el('div', { class: 'muted' }, `${juzLabel(juzOfPage(page || 1))} · مصحف المدينة`));
    if (mode === 'far') add(el('div', { class: 'pbig' }, 'صفحات المراجعة اليوم'), el('div', { class: 'pchips' }, d.todayFar.length ? d.todayFar.map(p => el('span', { class: 'pchip' }, p)) : el('span', { class: 'muted' }, 'لا صفحات')));
    if (mode === 'card') { const key = child === 'karim' ? 's' + surahsOfPage(page || 1)[0] : 'p' + page; const c = cards[key]; add(el('div', { class: 'pbig' }, child === 'karim' ? 'سورة ' + SURAH_NAMES[surahsOfPage(page || 1)[0] - 1] : `بطاقة صفحة ${page}`), c ? el('div', { class: 'pcard', html: cardHtml(c) }) : el('div', { class: 'muted' }, 'لا بطاقة لهذه الصفحة بعد')); }
    if (mode === 'mut') { const list = mutashabihat(child, weekStartKey(App.now())); add(el('div', { class: 'pbig' }, 'المتشابهات'), list.length ? list.map(e => el('div', { class: 'pline' }, `${SURAH_NAMES[e.surah - 1]} ${e.ayah} (ص${e.page})  ⟷  ${e.target ? SURAH_NAMES[e.target.surah - 1] + ' ' + (e.target.ayah || '') : '؟'}`)) : el('div', { class: 'muted' }, 'لا متشابهات هذا الأسبوع')); }
    if (mode === 'yellow') { const y = yellowList(child).active; add(el('div', { class: 'pbig' }, 'آيات نعيدها'), y.length ? y.map(it => el('div', { class: 'pline' }, `${SURAH_NAMES[it.surah - 1]} ${it.ayah} · صفحة ${it.page}`)) : el('div', { class: 'muted' }, 'لا آيات')); }
    bg.append(top, body);
  };
  render(); document.body.append(bg);
}


Store.load().then(() => { UI.init(); Sync.start(); });
