plugins { id 'com.android.application' }

// الإصدار من ملف VERSION في جذر المستودع: 0.14.0 → versionCode 1400
def appVersion = file('../../VERSION').text.trim()
def parts = (appVersion.tokenize('.') + ['0', '0', '0']).take(3).collect { it.isInteger() ? it.toInteger() : 0 }
def code = parts[0] * 10000 + parts[1] * 100 + parts[2]
// معاينة (-Ppreview=true): تطبيق منفصل (معرّف وأسم مختلفان) بمفتاح مؤقت، يُثبَّت بجانب الدائم ولا يتعارض معه
def preview = (project.findProperty('preview') ?: 'false').toString() == 'true'
// للاختبار الآلي على المحاكي فقط (لا يُنشر): تفعيل فحص WebView عن بُعد
def webdebug = (project.findProperty('webdebug') ?: 'false').toString() == 'true'

android {
    namespace 'app.lawhat.muallima'
    compileSdk 34
    defaultConfig {
        applicationId preview ? 'app.lawhat.muallima.preview' : 'app.lawhat.muallima'
        minSdk 26
        targetSdk 34
        versionCode code
        versionName appVersion + (preview ? '-preview' : '')
        buildConfigField 'boolean', 'PREVIEW', preview.toString()
        buildConfigField 'boolean', 'WEBDEBUG', webdebug.toString()
        resValue 'string', 'app_name', preview ? 'لوحة المعلمة (معاينة)' : 'لوحة المعلمة'
    }
    // مفتاح توقيع ثابت (أسرار GitHub): بدونه لا يُثبَّت التحديث فوق القديم إلا بإلغاء التثبيت، وإلغاء التثبيت يمحو البيانات
    signingConfigs {
        release {
            def ks = file('../release.p12')
            if (ks.exists()) {
                storeFile ks
                storeType 'PKCS12'
                storePassword System.getenv('KS_PASS')
                keyAlias 'lawhat'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
    buildFeatures { buildConfig true }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
